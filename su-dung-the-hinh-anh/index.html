<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sử dụng thẻ hình ảnh</title>
  </head>
  <body>
    <h1>Hình ảnh yêu thích của tôi</h1>

    <!-- 
      - Thuộc tính src: Đường dẫn tới hình ảnh (có thể dùng đường dẫn online hoặc file ảnh trong thư mục).
      - Thuộc tính alt: Mô tả hình ảnh (hiển thị khi ảnh bị lỗi và hỗ trợ SEO, đọc màn hình).
      - Thuộc tính width (tùy chọn): Chỉnh chiều rộng ảnh để hiển thị cân đối hơn.
    -->
    <img
      src="https://picsum.photos/600/400"
      alt="Hình ảnh thiên nhiên đẹp"
      width="600"
    />
  </body>
</html>
