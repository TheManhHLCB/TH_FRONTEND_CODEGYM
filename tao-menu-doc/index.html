<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thực hành - Tạo menu dọc Dropdown</title>
    <style>
      /* 1. Thiết lập chung tránh khác biệt giữa các trình duyệt */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      ul {
        padding: 0;
        margin: 0;
      }

      /* 2. Định dạng cho các thẻ li (mục trong menu) */
      #menu li {
        list-style: none; /* Bỏ ký hiệu chấm đầu dòng */
        position: relative; /* Làm mốc vị trí cho menu con absolute */
        width: 140px;
        height: 30px;
        padding: 0 20px;
        background-color: black;
        line-height: 30px;
        cursor: pointer;
      }

      /* 3. Định dạng cho thẻ liên kết a */
      #menu a {
        text-decoration: none; /* Bỏ gạch chân */
        color: white; /* Đổi màu chữ sang trắng */
        display: block;
      }

      /* 4. Hiệu ứng khi di chuột (hover) vào mục menu */
      #menu li:hover {
        background-color: #444;
      }

      /* 5. Cấu hình cho menu con (Dropdown list) */
      #menu li ul {
        position: absolute;
        top: 0;
        left: 140px; /* Đặt menu con xuất hiện ngay bên phải của menu cha (bằng width của li) */
        visibility: hidden; /* Ẩn menu con mặc định */
      }

      /* 6. Hiển thị menu con khi di chuột vào mục menu cha */
      #menu li:hover > ul {
        visibility: visible;
      }
    </style>
  </head>
  <body>
    <!-- Cấu trúc Menu dọc lồng nhau -->
    <div id="menu">
      <ul>
        <li><a href="#">Trang chủ</a></li>
        <li>
          <a href="#">Sản phẩm</a>
          <ul>
            <li><a href="#">Laptop</a></li>
            <li><a href="#">Điện thoại</a></li>
            <li><a href="#">Máy tính bảng</a></li>
          </ul>
        </li>
        <li>
          <a href="#">Dịch vụ</a>
          <ul>
            <li><a href="#">Bảo hành</a></li>
            <li><a href="#">Sửa chữa</a></li>
          </ul>
        </li>
        <li><a href="#">Liên hệ</a></li>
      </ul>
    </div>
  </body>
</html>
